name: Góp ý / báo lỗi — Feedback / bug report
description: Gửi góp ý, báo lỗi hoặc đề xuất tính năng cho AIC Builder. Send feedback, a bug report or a feature idea.
title: "[Góp ý] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã góp ý! Bạn có thể viết tiếng Việt hoặc tiếng Anh. Kéo thả ảnh chụp màn hình hoặc file bản vẽ (.json) vào ô mô tả để đính kèm.
        Thanks for the feedback! Vietnamese or English is fine. Drag screenshots or blueprint files (.json) into the description box to attach them.
  - type: dropdown
    id: kind
    attributes:
      label: Loại / Type
      options:
        - Góp ý cải thiện / Improvement
        - Báo lỗi / Bug
        - Đề xuất tính năng / Feature request
        - Dữ liệu game sai hoặc thiếu / Wrong or missing game data
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Nội dung / Details
      description: Bạn muốn góp ý gì, hoặc lỗi xảy ra thế nào? / What would you like to tell us, or what went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước để gặp lỗi (nếu là lỗi) / Steps to reproduce (for bugs)
      placeholder: |
        1. Mở map …
        2. Bấm …
        3. Thấy …
  - type: dropdown
    id: platform
    attributes:
      label: Bạn dùng bản nào? / Which version do you use?
      options:
        - Web
        - Windows
        - Android
  - type: input
    id: version
    attributes:
      label: Phiên bản app / App version
      description: Xem ở góc dưới bảng Cài đặt (ví dụ v0.4.1). / Shown at the bottom of Settings (e.g. v0.4.1).
