# Bản phát hành tự động (người dùng 2026-10-06): đẩy một tag "vX.Y.Z" lên GitHub (hoặc bấm "Run workflow" và nhập số
# phiên bản) ⇒ máy chủ GitHub chạy test (Node 22 — Capacitor 8 cần Node ≥ 22), build exe Windows + APK Android **bản public** (không có nhập bản vẽ trang tham khảo),
# rồi tạo bản phát hành kèm file với **tên cố định** — nút tải trong Cài đặt của bản web trỏ vào
# releases/latest/download/<tên file>.
#
# Cần 4 secret (Settings → Secrets and variables → Actions) để ký APK:
#   ANDROID_KEYSTORE_BASE64   file khoá .jks mã hoá base64
#   ANDROID_KEYSTORE_PASSWORD mật khẩu kho khoá
#   ANDROID_KEY_ALIAS         tên khoá trong kho
#   ANDROID_KEY_PASSWORD      mật khẩu khoá
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Số phiên bản, ví dụ 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          v="${raw#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Số phiên bản không hợp lệ: $raw"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node tools/set-version.mjs ${{ needs.version.outputs.version }}
      # bản public: tauri.public.conf.json đổi lệnh build web thành `npm run build:public`
      - run: npx tauri build --config src-tauri/tauri.public.conf.json
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/EndfieldAICPlanner.exe out/EndfieldAICPlanner.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/EndfieldAICPlanner-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node tools/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npm run build:public
      - run: npx cap sync android
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 — xem hướng dẫn tạo khoá ký ở đầu file workflow"
            exit 1
          fi
          # bỏ xuống dòng / khoảng trắng lỡ dán vào secret
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 không giải mã được — chép lại base64 của file .jks"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::Không mở được khoá: sai ANDROID_KEYSTORE_PASSWORD hoặc ANDROID_KEY_ALIAS (alias phải là endfield)"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/EndfieldAICPlanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Endfield AIC Planner v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            out/EndfieldAICPlanner-setup.exe
            out/EndfieldAICPlanner.exe
            out/EndfieldAICPlanner.apk
