# Kiểm tra tự động cho **mỗi commit / pull request** (2026-10-13): kiểm kiểu TypeScript, chạy toàn bộ test (kể cả test
# bản dịch tiếng Anh đủ câu), build bản web thường + bản public. Không build exe / apk (việc đó của release.yml khi đẩy
# tag "vX.Y.Z") nên chạy nhanh (~2–3 phút).
#
# Đẩy tag vX.Y.Z thì release.yml tự chạy lại test trước khi build ⇒ ở đây bỏ qua tag để không chạy hai lần.
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# commit mới đẩy lên cùng nhánh ⇒ huỷ lượt kiểm tra cũ còn đang chạy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (web)
        run: npx vite build
      - name: Build (public)
        run: npx vite build --mode public
      - name: Bundle size
        # ghi kích thước bản build vào trang tóm tắt của lượt chạy (để thấy khi nào bundle phình ra)
        run: |
          {
            echo '### Bundle (public build)'
            echo '```'
            du -sh dist
            ls -la dist/assets | awk '{print $5, $9}' | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
