[package]
name = "endfield-planner"
version = "0.4.4"
description = "Endfield AIC Planner — bản ứng dụng máy tính (Tauri)"
authors = ["Endfield AIC Planner"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "endfield_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
# tra mã bản vẽ của game (EFO0…) qua API của trang tham khảo — trong app không có proxy của Vite
ureq = "2"

# tắt các hành vi "trình duyệt" của WebView2 (phím tắt F5 / Ctrl+F / in / zoom, menu chuột phải…);
# phiên bản phải trùng với bản wry / tauri đang dùng (xem Cargo.lock)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# hộp thoại "Lưu file" của Windows cho nút Xuất (lệnh `save_text`) — chỉ bật thêm feature của crate đã có
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
